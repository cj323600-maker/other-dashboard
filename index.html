<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>코오롱오토옥션 지표 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <b>코오롱오토옥션 지표 대시보드</b>
      <span>전략기획팀</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="daily" aria-selected="true">일간 보고</button>
      <button class="tab" role="tab" data-tab="weekly" aria-selected="false">주간 보고</button>
    </nav>
    <span class="stamp">대외비</span>
  </div>
</header>

<div class="subbar">
  <div class="subbar-in">
    <span class="lbl" id="chiplabel">보고일</span>
    <div id="chipbar" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <span class="meta-r" id="meta"></span>
  </div>
</div>

<main id="view"><div class="state">불러오는 중…</div></main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="./assets/util.js"></script>
<script src="./assets/daily.js"></script>
<script src="./assets/weekly.js"></script>
<script src="./assets/app.js"></script>
</body>
</html>
