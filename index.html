<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>코오롱오토옥션 일간 보고</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#0f1a24; --ink2:#33475b; --muted:#6b7c8c;
  --line:#dee4ea; --line2:#eef1f4; --canvas:#f1f4f7; --surface:#fff;
  --ok:#0e7c66; --ok-bg:#e6f2ef; --warn:#b47800; --warn-bg:#fdf3e0;
  --bad:#c0392b; --bad-bg:#fbeceb; --base:#1f6feb;
  --r:10px; --sh:0 1px 2px rgba(15,26,36,.06),0 4px 14px rgba(15,26,36,.05);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
table{border-collapse:collapse;width:100%}

/* 헤더 */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;border-bottom:3px solid var(--ok)}
.top-in{max-width:1360px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand b{font-size:17px;letter-spacing:-.03em}
.brand span{font-size:12px;color:#9fb3c4;margin-left:9px}
.top .date{margin-left:auto;font-size:12.5px;color:#c9d6e2;font-variant-numeric:tabular-nums}
.stamp{font-size:11px;font-weight:700;letter-spacing:.08em;color:#ffb4ac;border:1px solid rgba(255,180,172,.45);padding:3px 8px;border-radius:4px}

main{max-width:1360px;margin:0 auto;padding:20px 22px 72px}
.note{background:#fffdf3;border:1px solid #f0e2b8;border-left:3px solid #d9a800;border-radius:var(--r);
  padding:10px 14px;font-size:12.5px;color:#6b5600;margin-bottom:18px}
.note b{color:#4a3c00}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.card>header{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>header h2{font-size:14.5px}
.card>header .sub{font-size:12px;color:var(--muted)}
.card>header .right{margin-left:auto;font-size:11.5px;color:var(--muted)}
.card>header .right b{color:var(--base)}
.pad{padding:14px 16px}
.grid{display:grid;gap:18px}
.g32{grid-template-columns:1.3fr 1fr}
@media(max-width:1000px){.g32{grid-template-columns:1fr}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh);padding:13px 14px}
.kpi.ok{border-top-color:var(--ok)}.kpi.warn{border-top-color:var(--warn)}.kpi.bad{border-top-color:var(--bad)}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:3px 0 1px}
.kpi .d{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi .d em{font-style:normal;font-weight:700}
.up{color:var(--base)}.down{color:var(--bad)}

/* 표 */
.tw{overflow-x:auto}
table.t{font-size:12.8px;min-width:900px}
table.t th,table.t td{border-bottom:1px solid var(--line2);padding:7px 9px;text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
table.t thead th{background:#f7f9fb;color:var(--ink2);font-weight:700;font-size:11.5px;text-align:center;border-bottom:1px solid var(--line)}
table.t th.l,table.t td.l{text-align:left;white-space:normal}
table.t td.c,table.t th.c{text-align:center}
table.t td.grp{background:#fafbfc;font-weight:700;text-align:center;border-right:1px solid var(--line2);color:var(--ink2);white-space:pre-line}
table.t tr.sub td{background:#f6f8fa;font-weight:700}
table.t tr.tot td{background:#edf1f5;font-weight:800;border-top:1px solid var(--line)}
table.t tbody tr:hover td:not(.grp){background:#f4f9ff}
td.ins{color:var(--bad);font-weight:600;white-space:normal;min-width:210px;text-align:left}
td.ins:empty::after{content:"—";color:var(--line);font-weight:400}
.na{color:var(--muted)}

/* 배지 */
.bg{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11.5px;font-weight:700}
.bg.ok{background:var(--ok-bg);color:var(--ok)}
.bg.warn{background:var(--warn-bg);color:var(--warn)}
.bg.bad{background:var(--bad-bg);color:var(--bad)}

/* 달성률 바 + 예상 진도율 기준선 */
.barwrap{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{position:relative;height:16px;width:120px;background:#eef1f4;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block;border-radius:3px}
.bar i.ok{background:var(--ok)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--base);text-decoration:none}
.barwrap b{font-weight:700;min-width:50px;text-align:right}

.chart{position:relative;height:250px}
.chart.sm{height:215px}
.hint{font-size:11.5px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);line-height:1.85}
.foot ul{margin:0;padding-left:18px}

@media print{.top{position:static}.card{break-inside:avoid;box-shadow:none}body{background:#fff}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>코오롱오토옥션 일간 보고</b><span>전략기획팀</span></div>
    <span class="date" id="today"></span>
    <span class="stamp">대외비</span>
  </div>
</header>

<main id="view"></main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   ▼ 여기만 매일 수정하면 됩니다 (엑셀 '일간 보고' 시트 값)
   ═══════════════════════════════════════════════════════════════ */
const DATA = {
  meta: {
    reportDate: "2026-08-24",
    businessDaysTotal: 20,     // J2 총 영업일
    businessDaysElapsed: 14,   // J3 영업일
    inputRule: "입력: 각 팀 당일 18:00 → 취합ㆍ게시: 전략기획팀"
  },

  /* ① 매입ㆍ유도 대수 — target 목표 / today 당일 실적 / mtd 월 누적
        당일 실적이 없으면 null */
  purchase: [
    { group:"자사 매입", team:"법인 영업 (자체+잔가+소매위탁)", owner:"김지훈", target:125, today:null, mtd:44   },
    { group:"자사 매입", team:"플랫폼 매입",                     owner:"조성익", target:200, today:11,   mtd:135  },
    { group:"출품 유도", team:"법인 영업 (제휴+협력점)",         owner:"김지훈", target:915, today:null, mtd:1191 }
  ],

  /* ② 경매장 입고현황 — secured 매입/유도 / inbound 입고 / perf 성능 / reg 등록 / expose 노출 */
  inbound: [
    { team:"법인영업팀 (자체+잔가+소매위탁+출품 유도)", owner:"김지훈/정경태", secured:null, inbound:17, perf:69, reg:358, expose:265, issue:"" },
    { team:"플랫폼매입팀 (매입 출품)",                  owner:"조성익/정경태", secured:57,   inbound:46, perf:46, reg:12,  expose:11,  issue:"11대 금일 매입" },
    { team:"출품영업팀 (출품전문점 및 전문인)",          owner:"정경태",        secured:65,   inbound:37, perf:86, reg:623, expose:637, issue:"" },
    { team:"경매운영팀 (FC+기타)",                      owner:"정경태",        secured:76,   inbound:32, perf:75, reg:338, expose:403, issue:"" }
  ],

  /* ③ 경매 처리 — 낙찰 대수 대비 정산ㆍ반출 */
  auction: {
    auctionDate:"2026-08-19", won:807, owner:"남윤정",
    labels:["경매일 (D-Day)","D+1","D+2","D+3","D+4"],
    settle: [409, 207, 133, null, null],
    release:[202, 294, 165, null, null],
    issue:"경매일 2026-08-19 기준 / 낙찰대수 807대"
  }
};
/* ═══════════════════════════════════════════════════════════════ */

/* ── 포맷ㆍ판정 유틸 ───────────────────────────────────────── */
const N  = v => (v===null||v===undefined) ? null : Number(v);
const num = v => v===null||v===undefined ? '<span class="na">-</span>' : Math.round(v).toLocaleString('ko-KR');
const dec = (v,d=1) => v===null||!isFinite(v) ? '-' : v.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=1) => v===null||!isFinite(v) ? '<span class="na">-</span>' : dec(v*100,d)+'%';
const pp  = v => { if(v===null||!isFinite(v)) return '<span class="na">-</span>';
  return (v>=0?'+':'−')+dec(Math.abs(v)*100,1)+'%p'; };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el  = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const sum = (a,k) => a.reduce((s,r)=>s+(N(r[k])||0),0);
/** 구성 행이 모두 미입력이면 0이 아니라 '-' 로 표기 */
const sumN = (a,k) => a.every(r=>N(r[k])===null) ? null : sum(a,k);
const grade = r => (r===null||!isFinite(r)) ? 'na' : r>=1 ? 'ok' : r>=0.9 ? 'warn' : 'bad';
const gLabel = g => ({ok:'달성',warn:'주의',bad:'미달',na:'-'})[g];

const EX = DATA.meta.businessDaysElapsed / DATA.meta.businessDaysTotal;   // 예상 진도율
const GAP = 0.10;                                                        // 인사이트 필수 임계치

/** 달성률 바 (파란 세로선 = 예상 진도율 기준선) */
function bar(ratio){
  if(ratio===null||!isFinite(ratio)) return '<span class="na">-</span>';
  const g = grade(ratio), w = Math.max(0,Math.min(1,ratio))*100;
  return `<div class="barwrap"><div class="bar"><i class="${g}" style="width:${w}%"></i>`
       + `<u style="left:${Math.min(100,EX*100)}%" title="예상 진도율 ${pct(EX)}"></u></div>`
       + `<b>${pct(ratio)}</b></div>`;
}
/** ±10%p 이탈 시 자동 문구 */
function insightOf(gapVal){
  if(gapVal===null||!isFinite(gapVal)) return '';
  if(gapVal <= -GAP) return `예상 대비 ${dec(Math.abs(gapVal)*100,1)}%p 뒤처짐 — 원인ㆍ대안 기재 필수`;
  if(gapVal >=  GAP) return `예상 대비 ${dec(gapVal*100,1)}%p 앞섬 — 입고ㆍ성능 처리 리드타임 점검`;
  return '';
}

const view = document.getElementById('view');
document.getElementById('today').textContent =
  `보고일 ${DATA.meta.reportDate} · 영업일 ${DATA.meta.businessDaysElapsed}/${DATA.meta.businessDaysTotal}일`;

/* ── 안내 ─────────────────────────────────────────────────── */
view.appendChild(el(`<div class="note">
  <b>본 화면의 실적 수치는 업로드된 엑셀 양식의 예시값입니다.</b>
  실제 보고 시 ERPㆍ경매 시스템 확정치로 교체하십시오.
  · ${esc(DATA.meta.inputRule)}</div>`));

/* ── 집계 ─────────────────────────────────────────────────── */
const P = DATA.purchase;
const own = P.filter(r=>r.group==="자사 매입"), ind = P.filter(r=>r.group==="출품 유도");
const tot = k => sum(P,k);
const rTot = tot('mtd')/tot('target');
const I = DATA.inbound;
const inbTot = { secured:sum(I,'secured'), inbound:sum(I,'inbound'), perf:sum(I,'perf'), reg:sum(I,'reg'), expose:sum(I,'expose') };
const A = DATA.auction;
const cum = arr => { let s=0; return arr.map(v=> v===null?null:(s+=v)); };
const sCum = cum(A.settle), rCum = cum(A.release);
const last = a => [...a].reverse().find(v=>v!==null) ?? 0;

/* ── KPI ──────────────────────────────────────────────────── */
const kpi = (k,v,d,r) => `<div class="kpi ${r===undefined?'':grade(r)}">
  <div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
const gapTag = r => `<em class="${r-EX>=0?'up':'down'}">${pp(r-EX)}</em> 예상 대비`;

view.appendChild(el(`<div class="kpis">
  ${kpi('예상 진도율 (월)', pct(EX), `영업일 <em>${DATA.meta.businessDaysElapsed}</em> / ${DATA.meta.businessDaysTotal}일`)}
  ${kpi('매입ㆍ유도 월 누적', num(tot('mtd'))+'대', gapTag(rTot), rTot)}
  ${kpi('당일 실적', num(tot('today'))+'대', `자사 매입 <em>${num(sumN(own,'today'))}</em> · 출품 유도 <em>${num(sumN(ind,'today'))}</em>`)}
  ${kpi('경매장 입고', num(inbTot.inbound)+'대', `입고율 <em>${pct(inbTot.inbound/inbTot.secured)}</em> (확보 ${num(inbTot.secured)}대)`)}
  ${kpi('경매 정산률', pct(last(sCum)/A.won), `반출률 <em>${pct(last(rCum)/A.won)}</em> · 낙찰 ${num(A.won)}대`, last(sCum)/A.won)}
</div>`));

const baseHint = `<span class="right">단위: 대 · 달성률 바의 <b>│</b> = 예상 진도율 ${pct(EX)}</span>`;

/* ── ① 매입ㆍ유도 대수 ────────────────────────────────────── */
function purchaseRow(r, opts={}){
  const ratio = r.target ? r.mtd/r.target : null;
  const gapV  = ratio===null ? null : ratio-EX;
  const ins   = r.insight ?? insightOf(gapV);
  return `<tr class="${opts.cls||''}">
    ${opts.grpCell||''}
    <td class="l" colspan="${opts.nameSpan||2}">${esc(r.team)}</td>
    <td class="c">${esc(r.owner||'-')}</td>
    <td>${num(r.target)}</td>
    <td>${num(r.today)}</td>
    <td>${num(r.mtd)}</td>
    <td>${bar(ratio)}</td>
    <td class="${gapV>=0?'up':'down'}">${pp(gapV)}</td>
    <td class="ins">${esc(ins)}</td></tr>`;
}
let pBody = '';
[["자사 매입",own,"소 계"],["출품 유도",ind,"소 계"]].forEach(([g,rows,sl])=>{
  rows.forEach((r,i)=>{
    pBody += purchaseRow(r,{ grpCell: i===0 ? `<td class="grp" rowspan="${rows.length+1}">${esc(g)}</td>` : '' });
  });
  pBody += purchaseRow(
    { team:sl, owner:'-', target:sum(rows,'target'), today:sumN(rows,'today'), mtd:sum(rows,'mtd') },
    { cls:'sub' });
});
pBody += purchaseRow(
  { team:'', owner:'-', target:tot('target'), today:sumN(P,'today'), mtd:tot('mtd') },
  { cls:'tot', grpCell:'<td class="grp">총 계</td>', nameSpan:2 });

view.appendChild(el(`<section class="card">
  <header><h2>① 매입ㆍ유도 대수</h2><span class="sub">자사 매입 · 출품 유도</span>${baseHint}</header>
  <div class="tw"><table class="t"><thead><tr>
    <th class="l" colspan="3">구분</th><th>담당자</th><th>목표</th><th>당일 실적</th><th>월 누적</th>
    <th style="min-width:180px">달성률 (%)</th><th>예상 대비 (%p)</th>
    <th class="l">인사이트 (±10%p 이탈 시 원인 필수)</th></tr></thead>
    <tbody>${pBody}</tbody></table></div>
  <div class="pad"><div class="chart sm" id="ch-pur"></div></div></section>`));

/* ── ② 경매장 입고현황 ────────────────────────────────────── */
const inbRow = (r,cls='') => {
  const rate = (r.secured && r.inbound!==null) ? r.inbound/r.secured : null;
  return `<tr class="${cls}">
    <td class="l">${esc(r.team)}</td><td class="c">${esc(r.owner||'-')}</td>
    <td>${num(r.secured)}</td>
    <td>${num(r.inbound)} <span class="hint">(${rate===null?'-':pct(rate)})</span></td>
    <td>${num(r.perf)}</td><td>${num(r.reg)}</td><td>${num(r.expose)}</td>
    <td class="ins">${esc(r.issue||'')}</td></tr>`;
};
view.appendChild(el(`<section class="card">
  <header><h2>② 경매장 입고현황</h2><span class="sub">당일 확보 → 입고 → 성능 → 등록 → 노출</span>
    <span class="right">단위: 대 · 입고율 = 입고 ÷ 매입ㆍ유도</span></header>
  <div class="tw"><table class="t"><thead><tr>
    <th class="l">구분</th><th>담당자</th><th>매입/유도 대수</th><th>입고 대수 (입고율)</th>
    <th>성능 대수</th><th>등록 대수</th><th>노출 대수</th><th class="l">이슈 사항</th></tr></thead>
    <tbody>${I.map(r=>inbRow(r)).join('')}
    ${inbRow({team:'총 계',owner:'-',...inbTot,issue:''},'tot')}</tbody></table></div>
  <div class="pad"><div class="chart sm" id="ch-inb"></div></div></section>`));

/* ── ③ 경매 처리 ──────────────────────────────────────────── */
const procRows = (label, daily, cumArr) => `
  <tr><td class="grp" rowspan="2">${label}</td><td class="l">${label} 대수</td>
    ${daily.map(v=>`<td>${num(v)}</td>`).join('')}<td><b>${num(last(cumArr))}</b></td></tr>
  <tr class="sub"><td class="l">${label}률 (누적)</td>
    ${cumArr.map(v=>`<td>${v===null?'<span class="na">-</span>':pct(v/A.won)}</td>`).join('')}
    <td>${pct(last(cumArr)/A.won)}</td></tr>`;

view.appendChild(el(`<section class="card">
  <header><h2>③ 경매 처리</h2>
    <span class="sub">경매일 ${esc(A.auctionDate)} · 낙찰 ${num(A.won)}대 · 담당 ${esc(A.owner)}</span>
    <span class="right">이슈: ${esc(A.issue)}</span></header>
  <div class="grid g32 pad">
    <div class="tw"><table class="t" style="min-width:600px"><thead><tr>
      <th class="l" colspan="2">구분</th>${A.labels.map(l=>`<th>${l}</th>`).join('')}<th>누적</th></tr></thead>
      <tbody>${procRows('정산',A.settle,sCum)}${procRows('반출',A.release,rCum)}</tbody></table>
      <p class="hint" style="margin:10px 0 0">
        정산률ㆍ반출률 = 해당 시점 <b>누적</b> ÷ 낙찰 대수(${num(A.won)}대) ·
        미입력(-) 구간은 누적에서 제외</p></div>
    <div class="chart" id="ch-auc"></div></div></section>`));

/* ── 각주 ─────────────────────────────────────────────────── */
view.appendChild(el(`<section class="card"><div class="pad foot"><ul>
  <li>${esc(DATA.meta.inputRule)}</li>
  <li>달성률 = 월 누적 ÷ 월 목표 · 예상 대비 = 달성률 − 예상 진도율(${pct(EX)}) ·
      <b>±10%p 이탈 시 인사이트에 원인 기재 필수</b></li>
  <li>판정 기준: 달성 ≥ 100% · 주의 ≥ 90% · 미달 &lt; 90%</li>
  <li>당일 매입ㆍ유도 총계와 경매장 입고현황 매입ㆍ유도 총계는 일치해야 함 — 불일치 시 집계 범위 확인</li>
</ul></div></section>`));

/* ── 차트 ─────────────────────────────────────────────────── */
const C = { ink:'#0f1a24', ok:'#0e7c66', warn:'#b47800', bad:'#c0392b', base:'#1f6feb', muted:'#6b7c8c', line:'#dee4ea' };
Chart.defaults.font.family = '"Pretendard Variable",Pretendard,system-ui,sans-serif';
Chart.defaults.font.size = 11;
Chart.defaults.color = C.muted;
Chart.defaults.maintainAspectRatio = false;
Chart.defaults.plugins.legend.labels.boxWidth = 10;
Chart.defaults.plugins.legend.labels.boxHeight = 10;
const cv = id => { const h=document.getElementById(id); h.innerHTML='<canvas></canvas>'; return h.querySelector('canvas'); };
const short = t => t.replace(/\s*\(.*\)/,'');

/* 팀별 달성률 vs 예상 진도율 */
new Chart(cv('ch-pur'), {
  type:'bar',
  data:{
    labels: P.map(r=>`${r.group==='자사 매입'?'자사':'유도'}·${short(r.team)}`),
    datasets:[{ label:'달성률',
      data: P.map(r=>+(r.mtd/r.target*100).toFixed(1)), borderRadius:3,
      backgroundColor: P.map(r=>({ok:C.ok,warn:C.warn,bad:C.bad,na:C.muted})[grade(r.mtd/r.target)]) }]
  },
  options:{
    plugins:{ legend:{display:false},
      title:{display:true,text:'팀별 달성률 (%) — 점선 = 예상 진도율',color:C.muted,align:'start'},
      tooltip:{callbacks:{afterLabel:c=>`예상 대비 ${pp(c.parsed.y/100-EX).replace(/<[^>]+>/g,'')}`}} },
    scales:{ y:{beginAtZero:true,ticks:{callback:v=>v+'%'},grid:{color:C.line}}, x:{grid:{display:false}} }
  },
  plugins:[{ id:'baseline', afterDraw(ch){
    const y=ch.scales.y.getPixelForValue(EX*100), {left,right}=ch.chartArea, x=ch.ctx;
    x.save(); x.strokeStyle=C.base; x.lineWidth=1.5; x.setLineDash([5,4]);
    x.beginPath(); x.moveTo(left,y); x.lineTo(right,y); x.stroke();
    x.setLineDash([]); x.fillStyle=C.base; x.font='600 10px Pretendard'; x.textAlign='right';
    x.fillText(`예상 진도율 ${dec(EX*100,1)}%`, right-2, y-5); x.restore(); }}]
});

/* 입고 단계별 */
new Chart(cv('ch-inb'), {
  type:'bar',
  data:{ labels: I.map(r=>short(r.team)),
    datasets:[
      { label:'매입ㆍ유도', data:I.map(r=>r.secured), backgroundColor:C.ink,  borderRadius:3 },
      { label:'입고',       data:I.map(r=>r.inbound), backgroundColor:C.ok,   borderRadius:3 },
      { label:'성능',       data:I.map(r=>r.perf),    backgroundColor:C.base, borderRadius:3 }]},
  options:{ plugins:{ legend:{position:'bottom'},
      title:{display:true,text:'팀별 확보 → 입고 → 성능 (대)',color:C.muted,align:'start'} },
    scales:{ y:{beginAtZero:true,grid:{color:C.line}}, x:{grid:{display:false}} } }
});

/* 경매 처리 누적률 */
new Chart(cv('ch-auc'), {
  type:'line',
  data:{ labels:A.labels.map(l=>l.replace('경매일 ','')),
    datasets:[
      { label:'정산률(누적)', data:sCum.map(v=>v===null?null:+(v/A.won*100).toFixed(1)),
        borderColor:C.ok, backgroundColor:'rgba(14,124,102,.10)', fill:true, tension:.3, pointRadius:3, spanGaps:false },
      { label:'반출률(누적)', data:rCum.map(v=>v===null?null:+(v/A.won*100).toFixed(1)),
        borderColor:C.base, backgroundColor:'rgba(31,111,235,.08)', fill:true, tension:.3, pointRadius:3, spanGaps:false }]},
  options:{ plugins:{ legend:{position:'bottom'},
      title:{display:true,text:'낙찰 대비 누적 처리율 (%)',color:C.muted,align:'start'},
      tooltip:{callbacks:{label:c=>`${c.dataset.label} ${c.parsed.y}%`}} },
    scales:{ y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'},grid:{color:C.line}}, x:{grid:{display:false}} } }
});
</script>
</body>
</html>
